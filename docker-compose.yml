# The web app only. The database, sign-in and file storage come from Supabase:
# either Supabase's own self-hosted Docker set-up or a Supabase cloud project.
# See docs/SELF_HOSTING.md.
#
# Put the two public values in a .env file next to this one (never commit it):
#   NEXT_PUBLIC_SUPABASE_URL=https://supabase.example.org
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=...
# then run: docker compose up -d --build

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env}
    image: research-platform:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
